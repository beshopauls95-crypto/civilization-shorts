name: AI Motion Production Test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/produce.yml', 'src/**', 'data/**', 'requirements.txt']
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke = 5-second test; episode requires distinct new AI scenes'
        required: true
        default: smoke
        type: choice
        options: [smoke, episode]
permissions:
  contents: read
  actions: read
concurrency:
  group: ai-motion-production
  cancel-in-progress: false
jobs:
  produce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_MODE: ${{ inputs.mode || 'smoke' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Guard repository artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          req=urllib.request.Request("https://api.github.com/repos/"+repo+"/actions/artifacts?per_page=100",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          if data["total_count"]>100:raise SystemExit("Too many artifacts to verify safely")
          used=sum(a["size_in_bytes"] for a in data["artifacts"] if not a["expired"])
          if used>180*1024*1024:raise SystemExit("Conservative repository artifact budget reached")
          PY
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Produce AI moving-scene preview
        run: python -m src.pipeline
      - name: Enforce artifact size
        run: |
          python - <<'PY'
          from pathlib import Path
          assert sum(p.stat().st_size for p in Path("build/bundle").iterdir()) < 50*1024*1024
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-${{ github.run_id }}
          path: build/bundle/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
