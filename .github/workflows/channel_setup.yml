name: Check or configure YouTube channel
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Check connection, or apply prepared channel description/keywords'
        type: choice
        options: [check, apply_profile]
        default: check
        required: true
permissions:
  contents: read
concurrency:
  group: youtube-channel-settings
  cancel-in-progress: false
jobs:
  setup:
    if: github.actor == 'beshopauls95-crypto' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.channel_setup
        env:
          SETUP_ACTION: ${{ inputs.action }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: channel-setup-${{ github.run_id }}
          path: build/channel-setup.json
          retention-days: 3
          if-no-files-found: ignore
