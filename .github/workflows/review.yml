name: Review video
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Exact successful production Run ID'
        type: string
        required: true
      manifest_sha256:
        description: 'SHA256 from production summary'
        type: string
        required: true
      decision:
        description: 'After watching and verifying sources'
        type: choice
        options: [reject, approve]
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: channel-ledger
  cancel-in-progress: false
jobs:
  review:
    if: github.actor == 'beshopauls95-crypto' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.review
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: ${{ inputs.run_id }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
          DECISION: ${{ inputs.decision }}
